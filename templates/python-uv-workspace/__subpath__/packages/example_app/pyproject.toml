[project]
name = "example-app"
version = "0.1.0"
description = "工作区应用成员：依赖 example-core，演示跨成员 import（参考样板，可重命名/删除）。"
requires-python = ">=3.12"
dependencies = ["example-core"]

[project.scripts]
example-app = "example_app.main:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.13.0"]
build-backend = "uv_build"

# 跨成员依赖：把 example-core 解析到本仓库 workspace 内的源码，而非去 index 拉。
[tool.uv.sources]
example-core = { workspace = true }
