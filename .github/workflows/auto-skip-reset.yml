# 复活闸：issue 一被人动过就摘掉 `auto:skip`，让 /routine-dev 下次重新完整分诊它。
#
# 为什么需要：routine 把「这条不适合无人值守做」的判断持久化成 label，是为了下次
# 不必再读一遍正文。但这个判断有可能是「正文没说清」这类会被补救的——正文补清楚
# 之后若没人摘标，这条 issue 就永久出局了，而人不会记得去摘一个 agent 内部用的
# label。
#
# 为什么用事件而不是存时间戳：判断「打标之后有没有被人动过」需要一个打标时刻的
# 锚点，三条存法都不通——存进 issue 评论要动 routine「绝不发评论」那道硬规则；
# 读 timeline 的 labeled 事件在云端取不到（无 gh、REST 403、内置 MCP 未见该能力，
# 而云端才是 routine 的主运行形态）；存进仓库文件则 routine 常有零 PR 的运行、
# 那次没有提交落点。于是干脆不存时刻：由 GitHub 在「有人动了」的那一刻直接摘标。
#
# 安全性质（对齐 ff-merge.yml 的同类注释）：本 job 由 issues / issue_comment 触发
# 而非 pull_request_target，**不 checkout 仓库、不执行工作区里的任何文件**，只调
# 一次 gh 摘 label；permissions 只要 issues: write。攻击面上限是「公开仓里任何人
# 评论都能让某条 issue 重新被完整分诊一次」——即今天的行为，放弃一次优化而已，
# 不构成提权。
#
# 不会自触发：label 增删发出的是 labeled / unlabeled，不在下面订阅的类型里
# （issues 的 edited 只对 title / body 编辑触发）；且 GITHUB_TOKEN 产生的事件按
# GitHub 规则不再触发新的 workflow run。
#
# ⚠ 本 job 的并发安全**完全建立在「摘 label 是幂等的」这一条上**：`if` 读的是
# 事件投递时冻结的 payload 快照，评论风暴下同 group 里可能有拿着陈旧快照的 run
# 排队后执行，重复摘一次不产生任何后果（下一轮 routine 会重新打标）。所以往这个
# job 里加**任何非幂等副作用**（发通知、写计数、改别的字段）都会破坏这条前提——
# 与 ff-merge.yml 里「别加执行工作区文件的步骤」是同一类护栏。
name: Reset auto:skip on issue activity

on:
  issues:
    types: [edited, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: auto-skip-reset-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reset:
    # PR 的评论也走 issue_comment，用 pull_request 字段把它排除掉；
    # 没打 skip 的 issue 直接不起 job，别为每条评论白跑一个 runner。
    if: >-
      github.event.issue.pull_request == null
      && contains(github.event.issue.labels.*.name, 'auto:skip')
    runs-on: ubuntu-latest
    steps:
      - name: Remove auto:skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --remove-label "auto:skip"
